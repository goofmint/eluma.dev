name: Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-api:
    name: Preview API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Preview to Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env preview

      - name: Comment PR with API preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.deploy.outputs.deployment-url }}`.trim();
            if (output && output.length > 0) {
              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `🚀 **API Preview:** ${output}`
                });
              } catch (error) {
                console.error('Failed to create comment:', error);
              }
            }

  preview-web:
    name: Preview Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate preview environment variables
        run: |
          if [ -z "$VITE_API_URL_PREVIEW" ] || [ -z "$VITE_AUTH_URL_PREVIEW" ]; then
            echo "::error::Missing required GitHub Variables for preview deployment."
            echo "::error::Please set VITE_API_URL_PREVIEW and VITE_AUTH_URL_PREVIEW in repository Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "Preview environment variables are configured."
        env:
          VITE_API_URL_PREVIEW: ${{ vars.VITE_API_URL_PREVIEW }}
          VITE_AUTH_URL_PREVIEW: ${{ vars.VITE_AUTH_URL_PREVIEW }}

      - name: Build Web
        run: pnpm -F @eluma/web build
        env:
          BUILD_TARGET: cloudflare
          VITE_API_URL: ${{ vars.VITE_API_URL_PREVIEW }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL_PREVIEW }}

      - name: Deploy Preview to Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env preview

      - name: Comment PR with Web preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.deploy.outputs.deployment-url }}`.trim();
            if (output && output.length > 0) {
              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `🌐 **Web Preview:** ${output}`
                });
              } catch (error) {
                console.error('Failed to create comment:', error);
              }
            }
